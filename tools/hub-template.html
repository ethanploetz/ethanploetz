<title>My Hub</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@600;800;900&family=Figtree:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
/* Layout: sunset-gradient sidebar rail + open warm court for content; big athletic numerals carry the hype. */
:root{
  --bg:#FCF6F2; --surface:#FFFFFF; --sunk:#F7ECE5; --ink:#2B1813; --muted:#7D6157; --line:#EEDCD2;
  --school:#B86A00; --vb:#E2470F; --fit:#D3263A; --about:#BF2C72;
  --sun1:#FF7A2E; --sun2:#EC3B4B; --sun3:#B5236C; --on-sun:#FFFFFF;
  --good:#1E8A4C; --warn:#C27A00; --bad:#C62828; --on-c:#FFFFFF;
  --display:"Big Shoulders Display","Arial Narrow","Helvetica Neue",Arial,sans-serif;
  --body:"Figtree","Segoe UI","Helvetica Neue",Arial,sans-serif;
  --r:12px;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#170F0D; --surface:#221613; --sunk:#2B1D19; --ink:#F8ECE6; --muted:#BC9D91; --line:#3C2A24;
  --school:#FFB547; --vb:#FF7A45; --fit:#FF5C6A; --about:#F2669F;
  --sun1:#E8641E; --sun2:#C92C42; --sun3:#8E1B57; --on-sun:#FFFFFF;
  --good:#4CC27F; --warn:#F2B13C; --bad:#FF6B6B; --on-c:#1A0F0C; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#170F0D; --surface:#221613; --sunk:#2B1D19; --ink:#F8ECE6; --muted:#BC9D91; --line:#3C2A24;
  --school:#FFB547; --vb:#FF7A45; --fit:#FF5C6A; --about:#F2669F;
  --sun1:#E8641E; --sun2:#C92C42; --sun3:#8E1B57; --on-sun:#FFFFFF;
  --good:#4CC27F; --warn:#F2B13C; --bad:#FF6B6B; --on-c:#1A0F0C; color-scheme:dark}
*,*::before,*::after{box-sizing:border-box}
html,body{min-height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.5 var(--body)}
button,input,select,textarea{font:inherit;color:inherit}
a{color:inherit}
.shell{display:grid;grid-template-columns:250px minmax(0,1fr);min-height:100vh}
/* Sidebar */
.side{position:sticky;top:env(safe-area-inset-top,0px);height:calc(100vh - env(safe-area-inset-top,0px) - env(safe-area-inset-bottom,0px));
  background:linear-gradient(165deg,var(--sun1) 0%,var(--sun2) 55%,var(--sun3) 100%);color:var(--on-sun);
  padding-block:22px;padding-left:max(18px,env(safe-area-inset-left,0px));padding-right:18px;display:flex;flex-direction:column;gap:18px;overflow:auto}
.brand{display:flex;align-items:center;gap:12px}
.mono{width:44px;height:44px;border-radius:50%;background:rgba(255,255,255,.18);border:2px solid rgba(255,255,255,.55);display:grid;place-items:center;font:900 1.35rem var(--display);letter-spacing:.02em}
.brand b{font:800 1.5rem/1 var(--display);letter-spacing:.02em;text-transform:uppercase}
.brand small{display:block;font-size:.78rem;opacity:.85;margin-top:3px}
nav.nav{display:flex;flex-direction:column;gap:4px}
.nav button{all:unset;cursor:pointer;display:flex;align-items:center;justify-content:space-between;gap:10px;padding:11px 12px;border-radius:10px;font:600 1rem var(--body);color:var(--on-sun)}
.nav button:hover{background:rgba(255,255,255,.12)}
.nav button[aria-current="page"]{background:rgba(255,255,255,.95);color:#2B1813}
.nav button:focus-visible{outline:2px solid #fff;outline-offset:2px}
.nav .lbl{display:flex;align-items:center;gap:10px}
.nav svg{width:18px;height:18px;flex:none}
.nav .meta{font:700 .78rem var(--body);opacity:.9;font-variant-numeric:tabular-nums;white-space:nowrap}
.themebtn{all:unset;cursor:pointer;display:flex;align-items:center;gap:10px;padding:10px 12px;border-radius:10px;font:600 .92rem var(--body);color:var(--on-sun);border:1px solid rgba(255,255,255,.35)}
.themebtn:hover{background:rgba(255,255,255,.12)}.themebtn:focus-visible{outline:2px solid #fff;outline-offset:2px}
.themebtn .lbl{display:flex;align-items:center;gap:10px}.themebtn svg{width:18px;height:18px;flex:none}
.side-foot{margin-top:auto;border-top:1px solid rgba(255,255,255,.3);padding-top:14px}
.side-foot .big{font:900 2.6rem/1 var(--display);font-variant-numeric:tabular-nums}
.side-foot .cap{font-size:.8rem;opacity:.9;text-transform:uppercase;letter-spacing:.08em}
.syncline{font-size:.75rem;opacity:.85;margin-top:8px}
/* Main */
main{min-width:0;padding-block:28px 64px;padding-left:clamp(16px,3vw,40px);padding-right:max(16px,env(safe-area-inset-right,0px))}
.wrap{max-width:1120px;margin:0 auto;display:flex;flex-direction:column;gap:22px}
.eyebrow{font:700 .74rem var(--body);text-transform:uppercase;letter-spacing:.12em;color:var(--c,var(--muted))}
h1,h2,h3{text-wrap:balance;margin:0}
h1{font:900 clamp(2.4rem,5vw,3.6rem)/.95 var(--display);text-transform:uppercase;letter-spacing:.01em}
h2{font:800 1.55rem/1.05 var(--display);text-transform:uppercase;letter-spacing:.02em}
h3{font:700 1.02rem/1.3 var(--body)}
.sub{color:var(--muted);margin:6px 0 0;max-width:62ch}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:18px}
.card-h{display:flex;align-items:baseline;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-bottom:14px}
.grid{display:grid;gap:16px}
.g2{grid-template-columns:repeat(2,minmax(0,1fr))}
.g3{grid-template-columns:repeat(3,minmax(0,1fr))}
.g4{grid-template-columns:repeat(4,minmax(0,1fr))}
.muted{color:var(--muted)}
.num{font-variant-numeric:tabular-nums}
.empty{color:var(--muted);padding:14px;border:1px dashed var(--line);border-radius:10px;text-align:center}
/* Hero */
.hero{position:relative;overflow:hidden;border-radius:16px;padding:26px 24px;background:linear-gradient(120deg,var(--sun1),var(--sun2) 60%,var(--sun3));color:var(--on-sun);display:grid;grid-template-columns:minmax(0,1.3fr) minmax(0,1fr);gap:20px;align-items:end}
.hero .eyebrow{color:rgba(255,255,255,.9)}
.hero h1{margin-top:6px}
.hero .hype{font:600 1.05rem/1.4 var(--body);margin:10px 0 0;max-width:46ch}
.grad{justify-self:end;text-align:right}
.grad .n{font:900 clamp(4rem,9vw,6.4rem)/.85 var(--display);font-variant-numeric:tabular-nums}
.grad .t{font:700 .8rem var(--body);text-transform:uppercase;letter-spacing:.1em}
.track{height:10px;background:rgba(255,255,255,.25);border-radius:99px;overflow:hidden;margin-top:12px}
.track i{display:block;height:100%;background:#fff;border-radius:99px}
.hero .court{position:absolute;right:-60px;top:-60px;width:260px;height:260px;border:2px solid rgba(255,255,255,.18);border-radius:50%;pointer-events:none}
/* Countdown tiles */
.cd{display:flex;flex-direction:column;gap:2px;padding:14px 16px;border-radius:var(--r);background:var(--surface);border:1px solid var(--line);position:relative;min-width:0}
.cd .n{font:900 2.7rem/1 var(--display);color:var(--c,var(--ink));font-variant-numeric:tabular-nums}
.cd .n small{font:800 1rem var(--display);margin-left:4px;text-transform:uppercase}
.cd .l{font-weight:600;line-height:1.3;overflow-wrap:anywhere}
.cd .d{font-size:.82rem;color:var(--muted)}
.cd .x{position:absolute;top:8px;right:8px}
/* Stat tiles */
.stat{padding:14px 16px;border-radius:var(--r);background:var(--sunk);min-width:0}
.stat .v{font:900 2.2rem/1 var(--display);font-variant-numeric:tabular-nums;color:var(--c,var(--ink))}
.stat .k{font-size:.82rem;color:var(--muted);margin-top:4px}
.flame{display:inline-flex;align-items:center;gap:6px}
.flame svg{width:22px;height:22px}
/* Buttons & forms */
.btn{all:unset;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;gap:6px;padding:9px 14px;border-radius:9px;background:var(--c,var(--vb));color:var(--on-c);font:700 .9rem var(--body);white-space:nowrap}
.btn:hover{filter:brightness(1.07)}
.btn:focus-visible,.chip:focus-visible,.ghost:focus-visible,.chk:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:2px solid var(--c,var(--vb));outline-offset:2px}
.btn[disabled]{opacity:.5;cursor:default}
.ghost{all:unset;cursor:pointer;padding:5px 9px;border-radius:7px;color:var(--muted);font:600 .82rem var(--body)}
.ghost:hover{color:var(--ink);background:var(--sunk)}
.ghost.danger{color:var(--bad)}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{all:unset;cursor:pointer;padding:6px 12px;border-radius:99px;border:1px solid var(--line);background:var(--surface);font:600 .84rem var(--body);color:var(--muted)}
.chip[aria-pressed="true"]{background:var(--c,var(--vb));border-color:var(--c,var(--vb));color:var(--on-c)}
form.f{display:flex;flex-wrap:wrap;gap:8px;align-items:end}
.fld{display:flex;flex-direction:column;gap:4px;min-width:0;flex:1 1 140px}
.fld.w2{flex:2 1 220px}
.fld.s{flex:0 1 110px}
.fld span{font:600 .74rem var(--body);color:var(--muted);text-transform:uppercase;letter-spacing:.06em}
input,select,textarea{width:100%;padding:9px 11px;border:1px solid var(--line);border-radius:9px;background:var(--bg);min-width:0}
textarea{min-height:76px;resize:vertical}
.chk{appearance:none;flex:none;width:22px;height:22px;border-radius:7px;border:2px solid var(--c,var(--vb));background:var(--surface);cursor:pointer;display:grid;place-items:center;margin:0}
.chk:checked{background:var(--c,var(--vb))}
.chk:checked::after{content:"";width:6px;height:11px;border:solid var(--on-c);border-width:0 2.5px 2.5px 0;transform:translateY(-1px) rotate(45deg)}
/* Lists */
.rows{display:flex;flex-direction:column}
.row{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:12px;align-items:center;padding:11px 0;border-top:1px solid var(--line)}
.row:first-child{border-top:0}
.row .t{font-weight:600;overflow-wrap:anywhere}
.row .m{font-size:.82rem;color:var(--muted)}
.row.done .t{text-decoration:line-through;color:var(--muted)}
.code{font:800 .82rem var(--display);letter-spacing:.06em;padding:2px 7px;border-radius:6px;background:var(--sunk);color:var(--ink);margin-right:6px;white-space:nowrap}
.pill{display:inline-flex;align-items:center;gap:4px;padding:3px 9px;border-radius:99px;font:700 .76rem var(--body);white-space:nowrap;background:var(--sunk);color:var(--ink)}
.pill.hot{background:var(--bad);color:var(--on-c)}
.pill.warm{background:var(--warn);color:var(--on-c)}
.pill.ok{background:var(--good);color:var(--on-c)}
.pill.c{background:var(--c);color:var(--on-c)}
.weekh{font:800 .95rem var(--display);text-transform:uppercase;letter-spacing:.06em;color:var(--muted);padding:16px 0 4px;border-bottom:2px solid var(--line)}
/* Progress */
.bar{height:12px;border-radius:99px;background:var(--sunk);overflow:hidden}
.bar i{display:block;height:100%;border-radius:99px;background:var(--c,var(--fit))}
.ring{width:84px;height:84px;flex:none}
/* Course cards */
.course{display:flex;flex-direction:column;gap:10px;cursor:default}
.course .top{display:flex;justify-content:space-between;align-items:flex-start;gap:8px}
.course .cc{font:900 1.7rem/1 var(--display);letter-spacing:.02em}
.course .grade{font:900 2rem/1 var(--display);color:var(--school);font-variant-numeric:tabular-nums;text-align:right}
.course .grade small{display:block;font:600 .7rem var(--body);color:var(--muted);text-transform:uppercase;letter-spacing:.08em}
.course.open{grid-column:1/-1}
/* Charts */
.chart{width:100%;height:auto;display:block;overflow:visible}
.chart text{fill:var(--muted);font:600 11px var(--body)}
.chart .gl{stroke:var(--line);stroke-width:1}
.chart .lab{fill:var(--ink);font:800 13px var(--display)}
#tip{position:fixed;z-index:50;pointer-events:none;background:var(--ink);color:var(--bg);padding:6px 9px;border-radius:7px;font:600 .8rem var(--body);max-width:240px;transform:translate(-50%,calc(-100% - 10px))}
/* Volleyball */
.next{display:grid;grid-template-columns:auto minmax(0,1fr);gap:20px;align-items:center}
.next .n{font:900 clamp(4rem,10vw,6rem)/.85 var(--display);color:var(--vb);font-variant-numeric:tabular-nums;text-align:center}
.next .n small{display:block;font:700 .78rem var(--body);color:var(--muted);text-transform:uppercase;letter-spacing:.1em;margin-top:6px}
.legs{margin:8px 0 0;padding:0;list-style:none;display:flex;flex-direction:column;gap:4px;font-size:.9rem}
.legs b{font:800 .85rem var(--display);letter-spacing:.05em;margin-right:6px;color:var(--vb);text-transform:uppercase}
.tour{display:flex;flex-direction:column;gap:10px}
.tour.past{opacity:.92}
.rec{font:900 1.6rem/1 var(--display);font-variant-numeric:tabular-nums}
.match{display:flex;align-items:center;gap:8px;padding:6px 0;border-top:1px dashed var(--line);font-size:.9rem}
.wl{font:900 .95rem var(--display);width:24px;height:24px;border-radius:6px;display:grid;place-items:center;color:var(--on-c);flex:none}
.wl.W{background:var(--good)}.wl.L{background:var(--bad)}
.note{padding:12px 14px;border-radius:10px;background:var(--sunk);display:flex;flex-direction:column;gap:6px}
.note.pin{background:color-mix(in oklab,var(--vb) 14%,var(--surface));border:1px solid color-mix(in oklab,var(--vb) 40%,var(--surface))}
.note p{margin:0;white-space:pre-wrap;overflow-wrap:anywhere}
/* Map */
.mapbox{position:relative;border-radius:12px;overflow:hidden;background:color-mix(in oklab,var(--about) 7%,var(--surface));border:1px solid var(--line)}
.mapbox svg{display:block;width:100%;height:auto;aspect-ratio:1000/520;cursor:grab;touch-action:none}
.land{fill:color-mix(in oklab,var(--about) 16%,var(--surface));stroke:var(--surface);stroke-width:.6}
.borders{fill:none;stroke:var(--surface);stroke-width:.5}
.route{fill:none;stroke:var(--about);stroke-width:1.4;stroke-dasharray:4 4;opacity:.75}
.pin circle.o{fill:var(--about);stroke:var(--surface)}
.pin text{fill:var(--on-c);font-family:var(--display);font-weight:900;text-anchor:middle;dominant-baseline:central;pointer-events:none}
.pin.tr circle.o{fill:var(--school)}
.pin.bk circle.o{fill:var(--surface);stroke:var(--school)}
.pin.sel circle.o{fill:var(--vb)}
.pin{cursor:pointer}
.maptools{position:absolute;left:10px;top:10px;display:flex;gap:6px;flex-wrap:wrap}
.maptools .chip:not([aria-pressed="true"]){background:color-mix(in oklab,var(--surface) 92%,transparent)}
.split>.card:first-child{position:sticky;top:16px}
.legend{display:flex;flex-wrap:wrap;gap:14px;font-size:.82rem;color:var(--muted);margin-top:10px}
.legend i{display:inline-block;width:11px;height:11px;border-radius:50%;margin-right:6px;vertical-align:-1px}
.tl{list-style:none;margin:0;padding:0;display:flex;flex-direction:column}
.tl li{display:grid;grid-template-columns:34px minmax(0,1fr) auto;gap:12px;padding:10px 6px;border-radius:10px;cursor:pointer;position:relative}
.tl li:hover{background:var(--sunk)}
.tl li.sel{background:color-mix(in oklab,var(--about) 12%,var(--surface))}
.tl .dot{width:30px;height:30px;border-radius:50%;background:var(--about);color:var(--on-c);display:grid;place-items:center;font:900 .95rem var(--display);position:relative;z-index:1}
.tl li:not(:last-child) .dot::after{content:"";position:absolute;left:14px;top:30px;width:2px;height:calc(100% + 0px);background:color-mix(in oklab,var(--about) 35%,var(--surface));z-index:-1}
.tl .yrs{font:800 1rem var(--display);font-variant-numeric:tabular-nums;color:var(--about);white-space:nowrap;text-align:right}
.tl .ms{display:inline-flex;margin:4px 6px 0 0;padding:2px 8px;border-radius:99px;background:color-mix(in oklab,var(--school) 16%,var(--surface));font:600 .76rem var(--body)}
.photos{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
.photo{position:relative;border-radius:10px;overflow:hidden;background:var(--sunk);aspect-ratio:1;max-width:100%;border:0;padding:0;cursor:zoom-in}
.photo img{width:100%;height:100%;object-fit:cover;display:block}
.photo span{position:absolute;left:0;right:0;bottom:0;padding:20px 8px 6px;background:linear-gradient(transparent,rgba(0,0,0,.65));color:#fff;font:600 .78rem var(--body);text-align:left}
.lightbox{position:fixed;inset:0;z-index:60;background:rgba(10,5,4,.88);display:grid;place-items:center;padding:max(20px,env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-right,0px)) max(20px,env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}
.lightbox figure{margin:0;max-width:min(960px,100%);display:flex;flex-direction:column;gap:10px;color:#fff}
.lightbox img{max-height:76vh;width:auto;max-width:100%;border-radius:10px;align-self:center}
.lightbox .bar2{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}
.lightbox .ghost{color:#fff}
/* Status */
.banner{padding:10px 14px;border-radius:10px;background:var(--sunk);font-size:.88rem;display:flex;gap:10px;align-items:center;justify-content:space-between;flex-wrap:wrap}
.banner.err{background:color-mix(in oklab,var(--bad) 14%,var(--surface))}
#toast{position:fixed;left:50%;bottom:calc(22px + env(safe-area-inset-bottom,0px));transform:translateX(-50%) translateY(20px);opacity:0;z-index:70;background:var(--ink);color:var(--bg);padding:12px 18px;border-radius:12px;font:800 1.05rem var(--display);letter-spacing:.04em;text-transform:uppercase;transition:.25s;pointer-events:none;max-width:calc(100% - 32px);text-align:center}
#toast.on{opacity:1;transform:translateX(-50%) translateY(0)}
.news{display:flex;flex-direction:column}
.story{display:grid;grid-template-columns:40px minmax(0,1fr);gap:12px;padding:14px 0;border-top:1px solid var(--line)}
.story:first-child{border-top:0;padding-top:0}
.story .sn{font:900 2rem/1 var(--display);color:var(--school);font-variant-numeric:tabular-nums}
.story h3{font-size:1.08rem;margin:2px 0 4px}
.story p{margin:0 0 6px;color:var(--ink);max-width:64ch}
.more{font:700 .84rem var(--body);color:var(--c,var(--vb));text-decoration:none}
.more:hover{text-decoration:underline}
.wx{display:flex;gap:16px;align-items:center;flex-wrap:wrap}
.wx .t{font:900 3rem/1 var(--display);font-variant-numeric:tabular-nums}
.wx .t small{font:800 1.2rem var(--display);color:var(--muted)}
.wxdays{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;margin-top:12px}
.wxdays div{background:var(--sunk);border-radius:9px;padding:8px 10px;font-size:.84rem}
.wxdays b{display:block;font:800 1rem var(--display);font-variant-numeric:tabular-nums}
.callout{margin-top:10px;padding:8px 12px;border-radius:9px;background:color-mix(in oklab,var(--warn) 18%,var(--surface));font-weight:600;font-size:.88rem}
.mv{display:grid;grid-template-columns:64px 74px minmax(0,1fr);gap:10px;align-items:baseline;padding:9px 0;border-top:1px solid var(--line);font-size:.9rem}
.mv:first-child{border-top:0}
.mv .tk{font:900 1.05rem var(--display);letter-spacing:.04em}
.mv .ch{font:800 1rem var(--display);font-variant-numeric:tabular-nums;text-align:right}
.up{color:var(--good)}.dn{color:var(--bad)}
.stat .v.up{color:var(--good)}.stat .v.dn{color:var(--bad)}
.quote{font:600 1.15rem/1.45 var(--body);margin:0}
.quote+div{color:var(--muted);margin-top:8px;font-size:.88rem}
.res-head{display:flex;justify-content:space-between;gap:14px;flex-wrap:wrap;align-items:flex-end;padding-bottom:14px;border-bottom:2px solid var(--about)}
.res-head .nm{font:900 2.2rem/1 var(--display);text-transform:uppercase;letter-spacing:.02em}
.res-sec h3{font:800 1.05rem var(--display);text-transform:uppercase;letter-spacing:.08em;color:var(--about);margin-bottom:6px}
.res-item{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:4px 12px;padding:8px 0;border-top:1px solid var(--line)}
.res-item:first-of-type{border-top:0}
.res-item .when{font:800 .9rem var(--display);color:var(--muted);font-variant-numeric:tabular-nums;white-space:nowrap;text-align:right}
.res-item .tt{font-weight:700}
.res-item .ss{font-size:.86rem;color:var(--muted);grid-column:1/-1}
.trips{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:16px}
.trip{all:unset;cursor:pointer;display:flex;flex-direction:column;border-radius:14px;overflow:hidden;background:var(--surface);border:1px solid var(--line);min-width:0}
.trip:focus-visible{outline:2px solid var(--about);outline-offset:3px}
.trip:hover .cov{filter:saturate(1.15)}

(function(){let r=(location.hash||"").slice(1);if(!ROUTES.some(x=>x.id===r)){try{r=localStorage.getItem("hub:route")}catch(e){}}if(ROUTES.some(x=>x.id===r))S.route=r})();
render();
async function loadDocs(){const snaps=await Promise.all(DOCS.map(n=>S.db.doc(`data/users/${S.uid}/${n}`).get().catch(()=>null)));
  snaps.forEach((s,i)=>{const n=DOCS[i];if(s&&s.exists){const d=JSON.parse(JSON.stringify(s.data()));S.docs[n]=Object.assign(JSON.parse(JSON.stringify(EMPTY[n])),d)}})}
(async function boot(){
  if(SNAP){for(const n of DOCS)if(SNAP.docs[n])S.docs[n]=Object.assign(JSON.parse(JSON.stringify(EMPTY[n])),SNAP.docs[n]);const st=SNAP.strava||{};S.strava={status:"ok",acts:st.acts||[],sets:st.sets||{},err:null,storedAt:Date.parse(SNAP.builtAt),setsStatus:"ok"};S.mode="snapshot";document.documentElement.classList.add("ro");render();return}
  const[db,user]=await Promise.all([use("db"),use("user")]);
  let id=null;try{id=user&&await user.id()}catch(e){}
  if(db&&id){S.db=db;S.uid=id;await loadDocs();S.mode="db";
    for(const n of DOCS){try{db.doc(`data/users/${id}/${n}`).onSnapshot(snap=>{if(timers[n]||!snap||!snap.exists||snap.metadata.hasPendingWrites)return;const d=JSON.stringify(snap.data());if(d===JSON.stringify(S.docs[n]))return;S.docs[n]=Object.assign(JSON.parse(JSON.stringify(EMPTY[n])),JSON.parse(d));rerender()},()=>{})}catch(e){}}}
  else{for(const n of DOCS){try{const raw=localStorage.getItem("hub:"+n);if(raw)S.docs[n]=Object.assign(JSON.parse(JSON.stringify(EMPTY[n])),JSON.parse(raw))}catch(e){}}S.mode="local"}
  render();
  const[mcp,sample,assets]=await Promise.all([use("mcp"),use("sample"),use("assets")]);S.mcp=mcp;S.sample=sample;S.assets=assets;startStrava();rerender();
})();
document.addEventListener("visibilitychange",async()=>{if(document.visibilityState==="visible"&&S.mode==="db"&&!Object.values(timers).some(Boolean)){try{await loadDocs();rerender()}catch(e){}}});
</script>
